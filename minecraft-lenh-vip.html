// ============================================================
//  RENDER ENGINE
// ============================================================

let ALL_COMMANDS = [];
let filteredCommands = [];
const PAGE_SIZE = 40;
const renderState = {};

function buildAllCommands() {
  const result = [];
  SECTIONS.forEach(sec => {
    const cmds = sec.gen();
    cmds.forEach(c => {
      c.sectionId = sec.id;
      c.sectionTitle = sec.title;
      result.push(c);
    });
  });
  return result;
}

function renderTOC() {
  const toc = document.getElementById('toc');
  toc.innerHTML = SECTIONS.map(s => {
    const count = ALL_COMMANDS.filter(c => c.sectionId === s.id).length;
    return `<div class="toc-group">
      <h3>${s.title.split(' ').slice(1).join(' ') || s.title}</h3>
      <a class="toc-link" data-section="${s.id}">${s.title} <span style="opacity:.5">(${count})</span></a>
    </div>`;
  }).join('');

  toc.querySelectorAll('.toc-link').forEach(link => {
    link.addEventListener('click', () => {
      document.getElementById(link.dataset.section).scrollIntoView({ behavior: 'smooth' });
      toc.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
    });
  });
}

function typeTag(type) {
  if (type === 'chat') return '<span class="tag tag-chat">Chat</span>';
  if (type === 'block') return '<span class="tag tag-block">Khối lệnh</span>';
  return '<span class="tag tag-both">Chat + Block</span>';
}

function renderCmdCard(c) {
  const modTag = c.version && c.version.includes('Mod') ? '<span class="tag tag-mod">Mod</span>' : '';
  return `<div class="cmd-card" data-type="${c.type}" data-tags="${c.tags.join(' ')} ${c.title.toLowerCase()}">
    <div class="cmd-head">
      <div>
        <div class="cmd-title">${c.title}</div>
        <div class="cmd-meta">
          ${typeTag(c.type)}
          <span class="tag tag-ver">${c.version}</span>
          ${modTag}
        </div>
      </div>
      <button class="copy-btn" data-cmd="${encodeURIComponent(c.command)}">📋 Copy</button>
    </div>
    <div class="cmd-body">
      ${c.desc ? `<div class="cmd-desc">${c.desc}</div>` : ''}
      ${c.usage ? `<div class="cmd-usage">💡 ${c.usage}</div>` : ''}
      <div class="cmd-code">${c.command.replace(/</g,'&lt;')}</div>
    </div>
  </div>`;
}

function renderSections(commands) {
  const content = document.getElementById('content');
  const bySection = {};
  commands.forEach(c => {
    if (!bySection[c.sectionId]) bySection[c.sectionId] = [];
    bySection[c.sectionId].push(c);
  });

  content.innerHTML = SECTIONS.map(sec => {
    const cmds = bySection[sec.id] || [];
    if (!cmds.length) return '';
    renderState[sec.id] = { shown: PAGE_SIZE, total: cmds.length };
    const initial = cmds.slice(0, PAGE_SIZE);
    const guide = sec.id === 'huong-dan' ? `
      <div class="guide-card">
        <h4>📌 Cách dùng nhanh</h4>
        <ul>
          <li><b>Chat:</b> Mở chat (T), dán lệnh, Enter — cần bật cheat/op.</li>
          <li><b>Khối lệnh:</b> <code>/give @s command_block</code> → đặt khối → mở → dán lệnh (không cần / đầu dòng).</li>
          <li><b>Repeat tím:</b> Repeat + Need Redstone → gắn Lever → gạt 1-2 giây → tắt ngay.</li>
          <li><b>@p</b> = người chơi gần nhất · <b>@s</b> = vị trí khối lệnh/entity · <b>~</b> = tọa độ tương đối.</li>
          <li><b>1.20.1</b> dùng <code>Enchantments:[{id:"protection",lvl:4s}]</code> · <b>1.21</b> dùng <code>components</code>.</li>
        </ul>
      </div>` : '';

    return `<section class="section" id="${sec.id}">
      <div class="section-header">
        <h2>${sec.title}</h2>
        <span class="badge">${cmds.length} lệnh</span>
      </div>
      ${guide}
      <div class="cmd-list" id="list-${sec.id}">
        ${initial.map(renderCmdCard).join('')}
      </div>
      ${cmds.length > PAGE_SIZE ? `<button class="load-more" data-section="${sec.id}">Xem thêm ${Math.min(PAGE_SIZE, cmds.length - PAGE_SIZE)} / ${cmds.length - PAGE_SIZE} lệnh còn lại ↓</button>` : ''}
    </section>`;
  }).join('');

  // Store full lists for load more
  SECTIONS.forEach(sec => {
    window['_cmds_' + sec.id] = bySection[sec.id] || [];
  });

  bindEvents();
}

function bindEvents() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = decodeURIComponent(btn.dataset.cmd);
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ Đã copy!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
      });
    });
  });

  document.querySelectorAll('.load-more').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.section;
      const all = window['_cmds_' + sid] || [];
      const list = document.getElementById('list-' + sid);
      const current = list.querySelectorAll('.cmd-card').length;
      const next = all.slice(current, current + PAGE_SIZE);
      next.forEach(c => {
        list.insertAdjacentHTML('beforeend', renderCmdCard(c));
      });
      bindEvents();
      const remaining = all.length - list.querySelectorAll('.cmd-card').length;
      if (remaining <= 0) btn.remove();
      else btn.textContent = `Xem thêm ${Math.min(PAGE_SIZE, remaining)} / ${remaining} lệnh còn lại ↓`;
      updateShownCount();
    });
  });
}

function filterCommands(query, typeFilter) {
  query = query.toLowerCase().trim();
  return ALL_COMMANDS.filter(c => {
    const matchType = typeFilter === 'all' || c.type === typeFilter || c.type === 'both' || (typeFilter === 'mod' && (c.version || '').includes('Mod'));
    const haystack = (c.title + ' ' + c.command + ' ' + c.desc + ' ' + c.tags.join(' ')).toLowerCase();
    const matchQuery = !query || haystack.includes(query);
    return matchType && matchQuery;
  });
}

function updateShownCount() {
  const shown = document.querySelectorAll('.cmd-card').length;
  document.getElementById('shown-count').textContent = shown.toLocaleString();
}

function init() {
  ALL_COMMANDS = buildAllCommands();
  document.getElementById('total-count').textContent = ALL_COMMANDS.length.toLocaleString();
  renderTOC();
  renderSections(ALL_COMMANDS);
  updateShownCount();

  let debounce;
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(debounce);
    debounce = setTimeout(() => applyFilters(), 200);
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    });
  });
}

function applyFilters() {
  const query = document.getElementById('search').value;
  const typeFilter = document.querySelector('.filter-btn.active').dataset.filter;
  filteredCommands = filterCommands(query, typeFilter);
  renderSections(filteredCommands);
  document.getElementById('shown-count').textContent = filteredCommands.length.toLocaleString();
}

init();
</script>
</body>
</html>
